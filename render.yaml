# Render Blueprint —— 一键部署 ChinaPass 到 Render（免费档）
# 使用：把本仓库推到 GitHub，然后在 Render 选 "New +" → "Blueprint" → 选该仓库。
# 文档：https://render.com/docs/blueprint-spec

databases:
  - name: chinapass-db
    plan: free
    databaseName: chinapass
    user: chinapass

services:
  - type: web
    name: chinapass
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # 由 Render 自动从上面的 Postgres 注入
      - key: DATABASE_URL
        fromDatabase:
          name: chinapass-db
          property: connectionString
      # 以下在 Render 控制台里手动填（sync: false = 部署时提示输入）
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders
      - key: NODE_ENV
        value: production
